name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly JMH compile smoke (full JMH is too slow for every PR)
    - cron: '0 6 * * 1'

# Default for the jobs below, which declare no permissions of their own.
permissions:
  contents: read

jobs:
  gradleWrapper:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1

  test:
    runs-on: ubuntu-latest
    needs: [gradleWrapper]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true

      - name: Spotless check
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run tests
        run: ./gradlew --no-daemon clean test

      - name: Compile JMH sources
        run: ./gradlew --no-daemon compileJmhJava

  jmh-compile-scheduled:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [gradleWrapper]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true

      - name: Compile JMH (scheduled)
        run: ./gradlew --no-daemon compileJmhJava
