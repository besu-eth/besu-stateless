plugins {
  id 'java-library'
  id 'maven-publish'
  id 'net.ltgt.errorprone' version '4.4.0'
  id 'io.spring.dependency-management' version '1.1.5'
  id 'com.diffplug.spotless' version '6.25.0'
  id 'me.champeau.jmh' version '0.7.3'
}

test {
  useJUnitPlatform()
}

dependencies {
  implementation 'com.google.guava:guava'
  implementation 'io.tmio:tuweni-bytes'
  implementation 'io.tmio:tuweni-units'
  implementation 'org.bouncycastle:bcprov-jdk18on'
  implementation 'org.hyperledger.besu.internal:trie'

  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testImplementation 'org.junit.jupiter:junit-jupiter-params'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  jmh 'org.openjdk.jmh:jmh-core:1.37'
  jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

version = rootProject.version

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
  maven {
    url = uri('https://hyperledger.jfrog.io/hyperledger/besu-maven')
    content { includeGroupByRegex('org\\.hyperledger\\..*') }
  }
}

jar {
  archiveBaseName = 'besu-stateless'
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': project.version,
      'Automatic-Module-Name': 'org.hyperledger.besu.partitionedbinarytrie'
      )
  }
}

apply from: "${rootDir}/gradle/versions.gradle"

dependencies {
  errorprone 'com.google.errorprone:error_prone_core'
}

apply plugin: 'com.diffplug.spotless'
spotless {
  java {
    target 'src/**/*.java'
    removeUnusedImports()
    googleJavaFormat('1.17.0')
    importOrder 'org.hyperledger', 'java', ''
    trimTrailingWhitespace()
    endWithNewline()
    licenseHeaderFile "${rootDir}/gradle/spotless.java.license"
  }
  groovyGradle {
    target '*.gradle'
    greclipse('4.30.0').configFile(rootProject.file('gradle/formatter.properties'))
    endWithNewline()
  }
}

tasks.withType(JavaCompile) {
  options.compilerArgs += [
    '-Xlint:unchecked',
    '-Xlint:cast',
    '-Xlint:rawtypes',
    '-Xlint:overloads',
    '-Xlint:divzero',
    '-Xlint:finally',
    '-Xlint:static',
    '-Werror',
  ]
  options.errorprone {
    check('EqualsGetClass', CheckSeverity.OFF)
    check('FutureReturnValueIgnored', CheckSeverity.OFF)
    check('ImmutableEnumChecker', CheckSeverity.OFF)
    check('UnnecessaryParentheses', CheckSeverity.OFF)
    if (JavaVersion.current() > JavaVersion.VERSION_12) {
      check('TypeParameterUnusedInFormals', CheckSeverity.OFF)
    }
    check('FieldCanBeFinal', CheckSeverity.WARN)
    check('InsecureCryptoUsage', CheckSeverity.WARN)
    check('WildcardImport', CheckSeverity.WARN)
  }
  options.encoding = 'UTF-8'
}

tasks.named('compileJmhJava') {
  options.compilerArgs -= '-Werror'
  options.errorprone {
    check('ThreadPriorityCheck', CheckSeverity.OFF)
  }
}

build.dependsOn spotlessApply

jmh {
  jmhVersion = '1.37'
  fork = 3
  warmupIterations = 3
  iterations = 5
  timeOnIteration = '1s'
  duplicateClassesStrategy = DuplicatesStrategy.INCLUDE
  if (project.hasProperty('includes')) {
    def patterns = project.property('includes').toString().split(',')
    includes = patterns.collect { ".*${it.trim()}.*" }
  } else {
    includes = ['.*']
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'org.hyperledger.besu'
      artifactId = 'besu-stateless'
      version = project.version
      from components.java
      pom {
        name = 'Besu Stateless — Partitioned Binary Trie'
        description = 'EIP-8297 Partitioned Binary Trie for Hyperledger Besu'
        url = 'https://github.com/besu-eth/besu-stateless'
        licenses {
          license {
            name = 'The Apache License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }
        scm {
          connection = 'scm:git:git://github.com/besu-eth/besu-stateless.git'
          developerConnection = 'scm:git:ssh://github.com/besu-eth/besu-stateless.git'
          url = 'https://github.com/besu-eth/besu-stateless'
        }
      }
    }
  }
}
