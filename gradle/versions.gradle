dependencyManagement {
    dependencies {
        // Aligned with Besu platform/build.gradle
        dependency 'com.google.guava:guava:33.5.0-jre'
        dependency 'org.bouncycastle:bcprov-jdk18on:1.84'

        dependencySet(group: 'io.consensys.tuweni', version: '2.7.2') {
            entry 'tuweni-bytes'
            entry 'tuweni-units'
        }

        dependencySet(group: 'org.hyperledger.besu.internal', version: '26.7.1') {
            entry 'besu-ethereum-trie'
        }

        dependency 'org.assertj:assertj-core:3.25.1'

        dependencySet(group: 'com.google.errorprone', version: '2.36.0') {
            entry 'error_prone_annotation'
            entry 'error_prone_check_api'
            entry 'error_prone_core'
            entry 'error_prone_test_helpers'
        }

        dependencySet(group: 'org.junit.platform', version: '1.11.4') {
            entry 'junit-platform-launcher'
        }

        dependencySet(group: 'org.junit.jupiter', version: '5.11.4') {
            entry 'junit-jupiter'
            entry 'junit-jupiter-api'
            entry 'junit-jupiter-engine'
            entry 'junit-jupiter-params'
        }
    }
}
